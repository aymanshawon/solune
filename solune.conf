# solune settings ✨  (~/.solune/solune.conf)
#
# Change anything here, any time after installing. No need to set anything
# up before. Save, then either switch modes or run `solune apply` to see it
# right away. Leave a theme value empty ("") and solune won't touch it.

# ---- Wallpaper folders ------------------------------------------------------
# The main folder. The three folders below can be inside it (just a name)
# or anywhere else (a full path, or one starting with ~).
WALLPAPER_DIR="~/.solune-wallpaper"

# Light and dark versions of the same picture, matched by name:
#   debian-white.jpg <-> debian-dark.jpg     city.jpg <-> city.jpg
# (dark / light / white / black / day / night at the start or end is ignored)
LIGHT_DIR="light"
DARK_DIR="dark"

# Auto mode picks a random picture from here.
COLORFUL_DIR="colorful"

# ---- Auto mode --------------------------------------------------------------
AUTO_INTERVAL=10            # minutes between wallpaper changes
AUTO_THEME=""               # theme while in Auto: "" = keep current, "light" or "dark"

# ---- Day & night schedule ---------------------------------------------------
# Switch to light and dark by the clock (24-hour times). A switch you make
# yourself stays until the next scheduled change.
SCHEDULE=true
DAY_START="07:00"           # light from this time...
NIGHT_START="18:00"         # ...and dark from this time

# ---- Light mode look --------------------------------------------------------
LIGHT_GTK_THEME=""          # app theme
LIGHT_WM_THEME=""           # window title bars
LIGHT_ICON_THEME=""
LIGHT_PANEL_DARK=""         # true = keep the panel dark even in light mode

# ---- Dark mode look ---------------------------------------------------------
DARK_GTK_THEME=""
DARK_WM_THEME=""
DARK_ICON_THEME=""
DARK_PANEL_DARK=""

# ---- Panel button icons -----------------------------------------------------
# Any icon name from your icon theme. Names ending in -symbolic draw dark
# grey and are hard to see on a dark panel.
PANEL_ICON_LIGHT=""         # sun
PANEL_ICON_DARK=""          # moon
PANEL_ICON_AUTO=""          # picture

# ---- Animation --------------------------------------------------------------
# A soft crossfade when the theme or wallpaper changes. Needs the compositor
# (Window Manager Tweaks → Compositor) and Python GTK.
ANIMATION=true
ANIMATION_MS=400            # fade length in milliseconds

# ---- Other ------------------------------------------------------------------
NOTIFY=false                # true = show a small popup on every switch
